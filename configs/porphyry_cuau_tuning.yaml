# Optuna search over the base config's model settings, scored by spatial CV on the
# training blocks only — the held-out test blocks are never seen while tuning.
#   pixi run tune
# The best settings are written to `output_config`; train it for the one-off test score:
#   pixi run train --config configs/porphyry_cuau_tuned.yaml

base_config: configs/porphyry_cuau.yaml
output_config: configs/porphyry_cuau_tuned.yaml

mlflow:
  run_name: porphyry-hgb-tuning

study:
  n_trials: 30
  timeout_minutes: 120        # stops starting new trials after this; finished trials are kept
  objective: pr_auc           # spatial-CV mean of this fold metric is maximised
  seed: 42
  pruning_startup_trials: 5   # after these, a trial is stopped early once it trails the median at the same fold

search_space:                 # HistGradientBoosting settings; everything else stays as in the base config
  learning_rate:     {type: float, low: 0.01, high: 0.2, log: true}
  max_iter:          {type: int, low: 100, high: 800, step: 50}
  max_leaf_nodes:    {type: int, low: 8, high: 64, log: true}
  min_samples_leaf:  {type: int, low: 20, high: 1000, log: true}   # larger leaves = smoother model, less overfitting
  l2_regularization: {type: float, low: 0.001, high: 10.0, log: true}
  max_features:      {type: float, low: 0.3, high: 1.0}            # share of features considered per split
