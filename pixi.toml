[workspace]
channels = ["conda-forge"]
name = "critical-minerals-canada"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
# each stage declares inputs/outputs, so pixi skips it when nothing it reads has changed
ingest = { cmd = "python scripts/01_ingest_geochem.py", inputs = ["scripts/01_ingest_geochem.py", "data/rgs2020_data.csv"], outputs = ["data/geochem_01_raw.parquet"] }
standardise = { cmd = "python scripts/02_standardise_geochem.py", depends-on = ["ingest"], inputs = ["scripts/02_standardise_geochem.py", "data/geochem_01_raw.parquet"], outputs = ["data/geochem_02_standardised.parquet"] }
validate = { cmd = "python scripts/03_validate_geochem.py", depends-on = ["standardise"], inputs = ["scripts/03_validate_geochem.py", "data/geochem_02_standardised.parquet"], outputs = ["data/geochem_03_validated.parquet", "outputs/geochem/geochem_validation_report.json"] }
spatial = { cmd = "python scripts/04_spatial_geochem.py", depends-on = ["validate"], inputs = ["scripts/04_spatial_geochem.py", "data/geochem_03_validated.parquet", "data/BC_digital_geology.gpkg", "data/BC_terranes.gpkg"], outputs = ["data/geochem_04_spatial.parquet"] }
features = { cmd = "python scripts/05_features_geochem.py", depends-on = ["spatial"], inputs = ["scripts/05_features_geochem.py", "data/geochem_04_spatial.parquet"], outputs = ["data/geochem_05_features.parquet", "outputs/geochem/geochem_metadata.yaml"] }
visualise = { cmd = "python scripts/06_visualise_geochem.py", depends-on = ["features"], inputs = ["scripts/06_visualise_geochem.py", "data/geochem_05_features.parquet"], outputs = ["outputs/geochem/*.png"] }
minfile = { cmd = "python scripts/07_get_minfile.py", inputs = ["scripts/07_get_minfile.py"], outputs = ["data/minfile_bc_raw.parquet"] }
terrain = { cmd = "python scripts/08_get_terrain_inventory.py", inputs = ["scripts/08_get_terrain_inventory.py"], outputs = ["data/terrain_inventory_bc_raw.parquet"] }
dem = { cmd = "python scripts/09_get_dem_geomorphometry.py", inputs = ["scripts/09_get_dem_geomorphometry.py", "data/BC_boundary.gpkg"], outputs = ["outputs/geomorphometry/dem.tif", "outputs/geomorphometry/tpi.tif", "outputs/geomorphometry/landforms.tif"] }
geophysics = { cmd = "python scripts/10_prep_geophysics.py", inputs = ["scripts/10_prep_geophysics.py", "data/geophysical/**/*.GRD"], outputs = ["outputs/geophysics/rtf.tif", "outputs/geophysics/1vd.tif", "outputs/geophysics/as.tif", "outputs/geophysics/tdr.tif"] }
training-table = { cmd = "python scripts/11_build_training_table.py", depends-on = ["features", "minfile"], inputs = ["scripts/11_build_training_table.py", "data/geochem_05_features.parquet", "data/minfile_bc_raw.parquet"], outputs = ["data/training_table.parquet"] }
hex-grid = { cmd = "python scripts/12_build_hex_grid.py", depends-on = ["features", "minfile", "terrain", "dem", "geophysics"], inputs = ["scripts/12_build_hex_grid.py", "data/geochem_05_features.parquet", "data/minfile_bc_raw.parquet", "data/terrain_inventory_bc_raw.parquet", "data/BC_boundary.gpkg", "data/BC_digital_geology.gpkg", "data/BC_terranes.gpkg", "outputs/geomorphometry/*.tif", "outputs/geophysics/*.tif"], outputs = ["data/hex_grid.parquet", "data/minfile_h3.parquet"] }
pipeline = { depends-on = ["visualise", "terrain", "dem", "geophysics", "training-table", "hex-grid"] }

[activation.env]
# Windows consoles default to cp1252, which can't print the ✓/— characters the stages log
PYTHONUTF8 = "1"

[dependencies]
geopandas = ">=1.1.3,<2"
pandas = ">=3.0.2,<4"
numpy = ">=2.4.3,<3"
rasterio = ">=1.5.0,<2"
xarray = ">=2026.2.0,<2027"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.2.0,<8"
python = "3.12.*"
openpyxl = ">=3.1.5,<4"
loguru = ">=0.7.3,<0.8"
pyarrow = ">=23.0.1,<24"
fiona = ">=1.10.1,<2"
pyyaml = ">=6.0.3,<7"
pystac-client = ">=0.9.0,<0.10"
planetary-computer = ">=1.0.0,<2"
odc-stac = ">=0.5.2,<0.6"
rioxarray = ">=0.22.0,<0.23"
rich = ">=15.0.0,<16"
plotnine = ">=0.15.8,<0.16"
font-ttf-roboto = ">=3.16,<4"
xarray-spatial = ">=0.10.17,<0.11"
scikit-learn = ">=1.9.1,<2"
h3-py = ">=4.5.0,<5"

[pypi-dependencies]
mlflow = ">=1.27.0, <2"
